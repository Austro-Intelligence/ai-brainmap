<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Live-Thinking-Mindmap</title>
<link rel="stylesheet" href="app.css">
<!-- M5: Styles in app.css ausgelagert. Dieses index.html ist reiner
     Shell + Markup. Kein Build-Step noetig. -->
</head>
<body>
<div id="offline-banner"><span class="dot"></span>Server offline — reconnecting…</div>
<div id="searchbar">
  <span class="icon">⌕</span>
  <input id="search-input" type="search" placeholder="Search nodes…" autocomplete="off" />
  <span class="hits" id="search-hits"></span>
</div>

<button id="auto-fit-btn" title="Auto-Fit (F)" aria-label="Auto-Fit">⤢</button>
<svg id="gizmo3d" width="110" height="110" viewBox="0 0 110 110"></svg>

<div id="settings" class="box">
  <div class="box-header" onclick="toggleBox('settings')">
    <span class="chevron">▼</span>
    <span>Settings</span>
  </div>
  <div class="box-body">
    <div class="sub slider-row">
      <span>History depth <em id="history-pct">69%</em></span>
      <input id="history-slider" type="range" min="0" max="100" step="1" />
    </div>
    <label class="setting" data-key="onlyActive">
      <span>Only active nodes</span><div class="toggle"></div>
    </label>
    <label class="setting" data-key="showLabels">
      <span>Node labels</span><div class="toggle"></div>
    </label>
    <div class="group-label">Display</div>
    <label class="setting" data-key="threeD">
      <span>3D</span><div class="toggle"></div>
    </label>
    <label class="setting" data-key="lightMode">
      <span>Light mode</span><div class="toggle"></div>
    </label>
    <label class="setting" data-key="overview">
      <span>Overview</span><div class="toggle"></div>
    </label>
    <div class="group-label">Session</div>
    <div class="sub llm-row">
      <span>Load</span>
      <select id="session-select"><option value="">— latest (live) —</option></select>
    </div>
    <div class="group-label">Export</div>
    <div class="sub llm-actions">
      <button id="export-png" type="button" title="Snapshot der 3D-Scene">PNG</button>
      <button id="export-svg" type="button" title="2D-Graph als SVG">SVG</button>
      <button id="export-json" type="button" title="Rohbaum + Thoughts + Settings">JSON</button>
    </div>
    <div class="group-label">Local LLM</div>
    <div class="sub llm-row">
      <span>URL</span>
      <input id="llm-url" type="text" value="localhost" placeholder="localhost" />
    </div>
    <div class="sub llm-row">
      <span>Port</span>
      <input id="llm-port" type="number" min="1" max="65535" value="1234" placeholder="1234" />
    </div>
    <div class="sub llm-row">
      <span>Model</span>
      <select id="llm-model"><option value="">—</option></select>
    </div>
    <div class="sub llm-actions">
      <button id="llm-reload" type="button">Load models</button>
      <button id="llm-refresh" type="button">Cluster now</button>
    </div>
    <div class="sub llm-status">
      <span>Next refresh in <em id="llm-countdown">—</em></span>
      <span id="llm-hint"></span>
    </div>
  </div>
</div>

<div id="legend" class="box">
  <div class="box-header" onclick="toggleBox('legend')">
    <span class="chevron">▼</span>
    <span>Legend</span>
  </div>
  <div class="box-body">
    <div id="legend-list"></div>
  </div>
</div>

<div id="os-notice" title="Open Source on GitHub">
  <a href="https://github.com/Austro-Intelligence/ai-brainmap" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.8 1.3 1.8 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
    <span>Open Source · GitHub</span>
  </a>
</div>

<div id="log" class="box collapsed">
  <div class="box-header" onclick="toggleBox('log')">
    <span class="chevron">▼</span>
    <span>Activity log</span>
    <span class="count" id="log-count">0</span>
  </div>
  <div class="box-body">
    <div id="log-list"></div>
  </div>
</div>

<div id="overview" class="box">
  <div class="box-header" onclick="toggleBox('overview')">
    <span class="chevron">▼</span>
    <span>Overview</span>
  </div>
  <div class="box-body">
    <svg id="overview-svg" viewBox="-110 -110 220 220" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<div id="footer">
  <div id="logo" class="logo">
    <a href="https://austro-intelligence.at" target="_blank" rel="noopener" class="reset">.<span class="austro">A</span>I <span class="muted">-</span> <span class="austro">Austro</span> Intelligence<span class="muted">.at</span></a>
  </div>
</div>

<div id="panel">
  <button class="close" onclick="closePanel()">×</button>
  <h3 id="p-title">—</h3>
  <div class="meta" id="p-meta"></div>
  <div id="p-body"></div>
</div>

<div id="map-3d"></div>
<svg id="map"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<!-- 3D-Stack: feste kompatible Versionen (three r147 + 3d-force-graph 1.71.5 + three-spritetext 1.7) -->
<script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
<script src="https://unpkg.com/three-spritetext@1.7.0/dist/three-spritetext.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.71.5/dist/3d-force-graph.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="app.js"></script>
<!-- M5: JS komplett in app.js ausgelagert — gleiches global scope,
     keine Module/Imports noetig. -->
</body>
</html>
